<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Al-Asyraf XVII</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.9)), url('Kepanjangan Nama Angkatan.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .bg-gold-header {
            background: linear-gradient(135deg, rgba(120, 53, 15, 0.95) 0%, rgba(69, 26, 3, 0.98) 100%);
            border-bottom: 4px solid #b45309;
        }
    </style>
</head>
<body class="text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <header class="bg-gold-header text-white py-4 shadow-lg">
        <div class="max-w-3xl mx-auto px-4 flex justify-between items-center">
            <h1 class="font-bold text-base sm:text-lg uppercase tracking-wider">Panel Admin - Upload Beranda</h1>
            <a href="index.html" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-3 py-1.5 rounded-md transition uppercase">Lihat Website</a>
        </div>
    </header>

    <main class="max-w-2xl mx-auto my-8 p-6 bg-white/95 backdrop-blur-md rounded-xl shadow-xl border border-amber-200">
        <h2 class="text-xl font-bold text-amber-900 mb-6 uppercase text-center tracking-wide">Buat Informasi / Postingan Baru</h2>
        
        <form id="form-posting" onsubmit="simpanPostingan(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Judul Postingan / Kegiatan</label>
                <input type="text" id="input-judul" required placeholder="Contoh: ZIARAH BULANAN / FILOSOFI LOGO" class="w-full px-3 py-2 border border-amber-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 uppercase">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Link Gambar / Poster (Opsional)</label>
                <input type="text" id="input-poster" placeholder="Masukkan link gambar Google Drive (link publik)" class="w-full px-3 py-2 border border-amber-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                <p class="text-[10px] text-slate-500 mt-1">Tips: Gunakan link gambar dari Google Drive atau link berformat https://...</p>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Isi Keterangan / Teks Panjang (Bisa Enter Berkali-kali)</label>
                <textarea id="input-keterangan" rows="8" required placeholder="Tulis informasi selengkapnya di sini. Tekan Enter untuk membuat paragraf baru..." class="w-full px-3 py-2 border border-amber-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 leading-relaxed"></textarea>
            </div>

            <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 rounded-lg shadow transition uppercase tracking-wider text-xs">
                Publish Postingan Sekarang 🚀
            </button>
        </form>
        
        <div id="status-pesan" class="mt-4 text-center text-xs font-semibold"></div>
    </main>

    <footer class="text-center py-4 text-slate-500 text-xs bg-white/80 border-t border-amber-200 uppercase">
        &copy; 2026 Al-Asyraf XVII Admin Panel.
    </footer>

    <script>
        function simpanPostingan(e) {
            e.preventDefault();
            
            const judul = document.getElementById('input-judul').value.trim();
            const rawPoster = document.getElementById('input-poster').value.trim();
            const keterangan = document.getElementById('input-keterangan').value.trim();
            
            let poster = "";
            if (rawPoster.includes("id=")) {
                const fileId = rawPoster.split("id=")[1].split("&")[0];
                poster = `https://lh3.googleusercontent.com/d/${fileId}`;
            } else if (rawPoster.startsWith("http")) {
                poster = rawPoster;
            }

            // Format tanggal otomatis
            const sekarang = new Date();
            const tanggal = sekarang.toLocaleDateString('id-ID');
            const jam = sekarang.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            const timestamp = `${tanggal} ${jam}`;

            // Buat objek data postingan baru
            const dataBaru = {
                timestamp: timestamp,
                judul: judul,
                poster: poster,
                keterangan: keterangan
            };

            // Ambil data postingan lama dari localStorage browser
            let daftarPostingan = JSON.parse(localStorage.getItem('portal_alasyraf_posts')) || [];
            
            // Masukkan data baru ke urutan paling atas
            daftarPostingan.unshift(dataBaru);

            // Simpan kembali ke localStorage
            localStorage.setItem('portal_alasyraf_posts', JSON.stringify(daftarPostingan));

            // Tampilkan pesan sukses
            const statusPesan = document.getElementById('status-pesan');
            statusPesan.innerHTML = `<span class="text-emerald-600 font-bold">✅ Berhasil dipublish! Silakan cek halaman Beranda website utama.</span>`;
            
            // Reset form
            document.getElementById('form-posting').reset();
            
            setTimeout(() => {
                statusPesan.innerHTML = "";
            }, 4000);
        }
    </script>
</body>
</html>
